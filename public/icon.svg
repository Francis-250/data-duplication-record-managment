<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091E3A" />
      <stop offset="50%" stop-color="#112F5A" />
      <stop offset="100%" stop-color="#1A4078" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="1.8" filter="url(#shadow)"/>

  <!-- Top System Header Linkage Nodes -->
  <g transform="translate(0, 1)">
    <circle cx="22" cy="12" r="3" fill="#38BDF8" />
    <circle cx="42" cy="12" r="3" fill="#F59E0B" />
    <path d="M22,15 C22,20 32,19 32,24" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
    <path d="M42,15 C42,20 32,19 32,24" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="32" cy="24" r="2.5" fill="#34D399" />
  </g>

  <!-- Left Record Card -->
  <rect x="13" y="22" width="18" height="23" rx="3" fill="#1E293B" stroke="#64748B" stroke-width="1.2" opacity="0.95" />
  <line x1="16" y1="26" x2="25" y2="26" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="16" y1="30" x2="27" y2="30" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
  <line x1="16" y1="34" x2="23" y2="34" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />

  <!-- Right Record Card (Overlapping - Deduplication / Matching) -->
  <rect x="33" y="22" width="18" height="23" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" opacity="0.95" />
  <line x1="36" y1="26" x2="45" y2="26" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="36" y1="30" x2="47" y2="30" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="36" y1="34" x2="43" y2="34" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />

  <!-- Central Match & Deduplication Node (Linked Checkmark Shield) -->
  <circle cx="32" cy="33.5" r="7.5" fill="#0F172A" stroke="url(#cyanGrad)" stroke-width="1.5" />
  <circle cx="32" cy="33.5" r="5.5" fill="url(#emeraldGrad)" />
  <!-- Match Checkmark -->
  <path d="M29.5,33.5 L31.2,35.5 L34.5,31.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- DDRM Acronym at bottom (Data Deduplication & Record Matching) -->
  <text x="32" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="2">DDRM</text>
</svg>
