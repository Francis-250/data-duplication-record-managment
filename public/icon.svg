<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091E3A" />
      <stop offset="50%" stop-color="#112F5A" />
      <stop offset="100%" stop-color="#1A4078" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.8" filter="url(#shadow)"/>

  <!-- Academic Mortarboard / Graduation Cap -->
  <g transform="translate(0, -1)">
    <!-- Cap Diamond -->
    <polygon points="32,9 49,16 32,23 15,16" fill="url(#goldGrad)" />
    <!-- Cap Skull Base -->
    <path d="M21,18.5 L21,24.5 C21,28 43,28 43,24.5 L43,18.5" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />
    <!-- Tassel -->
    <path d="M44,16.5 L47,21 L47,26" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="47" cy="27" r="1.2" fill="#FDE047" />
  </g>

  <!-- Left Record Card -->
  <rect x="14" y="26" width="18" height="23" rx="3" fill="#1E293B" stroke="#64748B" stroke-width="1.2" opacity="0.95" />
  <line x1="17" y1="30" x2="26" y2="30" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="17" y1="34" x2="28" y2="34" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
  <line x1="17" y1="38" x2="24" y2="38" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />

  <!-- Right Record Card (Overlapping - Deduplication / Matching) -->
  <rect x="32" y="26" width="18" height="23" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" opacity="0.95" />
  <line x1="35" y1="30" x2="44" y2="30" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="35" y1="34" x2="46" y2="34" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="35" y1="38" x2="42" y2="38" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />

  <!-- Central Match & Deduplication Node (Linked Checkmark Shield) -->
  <circle cx="32" cy="37" r="7.5" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="1.5" />
  <circle cx="32" cy="37" r="5.5" fill="url(#emeraldGrad)" />
  <!-- Match Checkmark -->
  <path d="M29.5,37 L31.2,39 L34.5,35" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- UoK Monogram at bottom -->
  <text x="32" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" fill="#FDE047" text-anchor="middle" letter-spacing="1.5">UoK</text>
</svg>
